name: Feature request
description: Something you want the orchestrator, the workers, the pane or the status line to do, that crew does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The situation and what you would like to happen, as you would tell the orchestrator.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What crew or Claude Code does now, and what is missing or gets in the way.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of crew it touches, if you know it.
      multiple: true
      options:
        - Delegating and reusing workers
        - Messages between agents
        - The pane
        - The conversation (transcript)
        - The status line
        - Progress and plans
        - The orchestrator's persona and figure
        - Languages
        - The Desktop app
        - Something else
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways it could work, or tools that do something like it.
