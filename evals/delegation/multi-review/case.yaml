schema_version: '1.1'
name: multi-review
description: A review across every module is work for the crew, not for the orchestrator.
tags: [delegation, multi-file]
runs: 1
execution:
  max_turns: 4
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep]
  prompt: |
    Review every module under `src/` of this project for missing input validation and tell me the findings per file.
context:
  scaffold_script: fixture.sh
graders:
  - name: delegates
    type: tool_used
    tool: mcp__crew__delegate
    min: 1
