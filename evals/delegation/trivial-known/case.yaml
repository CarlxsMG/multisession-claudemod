schema_version: '1.1'
name: trivial-known
description: An answer it already knows needs no worker and no tool.
tags: [delegation, trivial]
runs: 1
execution:
  max_turns: 4
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep]
  prompt: |
    In one sentence: what does `git stash pop` do?
graders:
  - name: does-it-itself
    type: tool_used
    tool: mcp__crew__delegate
    min: 0
    max: 0
